apiVersion: v1
kind: ServiceAccount
metadata:
  name: analyst-sa
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: monitoring
  name: soc-analyst
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: soc-analyst-binding
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: analyst-sa
    namespace: monitoring
roleRef:
  kind: Role
  name: soc-analyst
  apiGroup: rbac.authorization.k8s.io